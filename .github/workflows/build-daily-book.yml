name: Send Latest AI Daily to WeCom

on:
  schedule:
    # 每天北京时间 07:10 获取 hex2077.dev 的最新日报并发送企业微信
    - cron: '10 7 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

jobs:
  send-latest-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve latest report from hex2077.dev
        id: report
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://hex2077.dev"
          INDEX_URL="${BASE_URL}/docs/"

          echo "正在读取日报中心：${INDEX_URL}"

          INDEX_HTML=$(curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 15 \
            --max-time 60 \
            -A "Mozilla/5.0 GitHub-Actions-AI-Daily-Bot" \
            "$INDEX_URL")

          # 提取形如 /docs/2026-08/2026-08-02/ 的日报链接，按日期倒序取最新一期
          LATEST_PATH=$(printf '%s' "$INDEX_HTML" \
            | grep -oE '/docs/[0-9]{4}-[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}/' \
            | sort -u -r \
            | head -n 1 || true)

          if [ -z "${LATEST_PATH:-}" ]; then
            echo "::error::未能从 ${INDEX_URL} 解析出最新日报链接"
            exit 1
          fi

          REPORT_DATE=$(basename "${LATEST_PATH%/}")
          REPORT_URL="${BASE_URL}${LATEST_PATH}"

          # 验证日报页面可访问
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 15 \
            --max-time 60 \
            -A "Mozilla/5.0 GitHub-Actions-AI-Daily-Bot" \
            -o /dev/null \
            "$REPORT_URL"

          echo "date=${REPORT_DATE}" >> "$GITHUB_OUTPUT"
          echo "url=${REPORT_URL}" >> "$GITHUB_OUTPUT"

          echo "最新日报日期：${REPORT_DATE}"
          echo "最新日报链接：${REPORT_URL}"

      - name: Send latest report to WeCom
        shell: bash
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL_RISK_TEST }}
          REPORT_DATE: ${{ steps.report.outputs.date }}
          REPORT_URL: ${{ steps.report.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "${WECOM_WEBHOOK_URL:-}" ]; then
            echo "::error::未配置 GitHub Actions Secret：WECOM_WEBHOOK_URL_RISK_TEST"
            exit 1
          fi

          MARKDOWN_CONTENT=$(cat <<EOF
          ## AI 资讯日报｜${REPORT_DATE}

          hex2077.dev 已发布最新一期 AI 资讯日报。

          [点击查看最新日报](${REPORT_URL})
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg content "$MARKDOWN_CONTENT" \
            '{msgtype:"markdown",markdown:{content:$content}}')

          echo "正在发送企业微信消息……"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WECOM_WEBHOOK_URL")

          echo "企业微信返回：${RESPONSE}"

          ERR_CODE=$(echo "$RESPONSE" | jq -r '.errcode // empty')
          ERR_MSG=$(echo "$RESPONSE" | jq -r '.errmsg // "未知错误"')

          if [ "$ERR_CODE" != "0" ]; then
            echo "::error::企业微信发送失败，errcode=${ERR_CODE:-missing}，errmsg=${ERR_MSG}"
            exit 1
          fi

          echo "企业微信消息发送成功。"
