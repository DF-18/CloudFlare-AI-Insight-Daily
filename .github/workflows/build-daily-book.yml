name: Build Daily Journal

on:
  # 每天UTC时间0点自动触发 (对应北京时间早上8点)
  # schedule:
  #   - cron: '0 23 * * *'
    
  # 手动触发
  workflow_dispatch:
  
jobs:
  build-book:
    runs-on: ubuntu-latest
      
    # 需要写入权限来提交生成的文件和归档的日刊
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 明确指定要检出的分支
          ref: 'book' # <-- 请将 'book' 替换为你的目标分支名

      - name: Archive old notes
        id: archive
        run: |
          echo "开始检查并归档旧的日刊..."
          # 查找最新文件以确定当前月份
          LATEST_DAILY_FILE=$(find daily -type f -name "*.md" | sort -r | head -n 1)
          if [ -z "$LATEST_DAILY_FILE" ]; then
            echo "在 'daily' 目录中没有找到任何 .md 文件，跳过归档步骤。"
            exit 0
          fi
          
          LATEST_MONTH=$(basename "$LATEST_DAILY_FILE" .md | cut -d'-' -f1,2)
          echo "当前最新月份是: $LATEST_MONTH"

          # 仅遍历 daily/ 根目录下的 md 文件进行归档
          for file in daily/*.md; do
            # 如果根目录下没有md文件，循环会匹配到 "daily/*.md" 字符串，需要跳过
            [ -e "$file" ] || continue
            
            FILE_MONTH=$(basename "$file" .md | cut -d'-' -f1,2)
            
            if [ "$FILE_MONTH" != "$LATEST_MONTH" ]; then
              TARGET_DIR="daily/$FILE_MONTH"
              mkdir -p "$TARGET_DIR"
              echo "归档文件: $file -> $TARGET_DIR/"
              mv "$file" "$TARGET_DIR/"
            fi
          done
          echo "文件归档检查完成。"

      - name: Trigger RSS Data Write (2 attempts, 3 retries each)
        run: |
          # 检查 `WRITE_RSS_URL` 变量是否已设置
          if [ -z "${{ vars.WRITE_RSS_URL }}" ]; then
            echo "警告: WRITE_RSS_URL 仓库变量未设置或为空，跳过此步骤。"
            exit 0
          fi

          # 设置时区为 Asia/Shanghai (东八区)，并获取 YYYY-MM-DD 格式的日期
          TODAY_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)
          FULL_URL="${{ vars.WRITE_RSS_URL }}?date=$TODAY_DATE"
          
          echo "将向以下 URL 发送2次请求（每次请求若失败则重试3次）:"
          echo "$FULL_URL"
          
          # 循环两次，发送两次独立的请求
          for i in 1 2
          do
            echo "---"
            echo "正在发送第 $i 次请求..."
            
            # 使用 curl 发起请求，并配置重试逻辑
            # -f: 在遇到服务器HTTP错误时，以错误码退出（对CI/CD很重要）
            # -sS: 静默模式，但仍然显示错误信息
            # --retry 3: 如果命令失败，则最多重试3次
            # --retry-delay 5: 每次重试之间等待5秒
            # --retry-connrefused: 在“连接被拒绝”时也进行重试，增强网络抖动的鲁棒性
            if curl -fsS --retry 3 --retry-delay 5 --retry-connrefused "$FULL_URL"; then
              echo "第 $i 次请求成功。"
            else
              echo "错误：第 $i 次请求在3次重试后仍然失败。"
              # 使整个步骤失败
              exit 1
            fi
          done
          
          echo "---"
          echo "两次请求均已成功发送。"
          
      - name: Download RSS Feed
        run: |
          if [ -z "${{ vars.RSS_FEED_URL }}" ]; then
            echo "警告: RSS_FEED_URL 仓库变量未设置或为空，跳过下载。"
          else
            echo "正在从 ${{ vars.RSS_FEED_URL }} 下载 RSS Feed..."
            if wget -O rss.xml "${{ vars.RSS_FEED_URL }}" --timeout=30 --tries=3; then
              echo "RSS Feed 已成功下载到 rss.xml"
            else
              echo "错误: 下载 RSS Feed 失败。wget 返回错误码 $?。"
            fi
          fi
          
      # 提交并推送本次生成的日报
      - name: Commit and push changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 添加日报及归档目录
          if [ -d "today" ]; then
            git add today/
          fi

          if [ -d "daily" ]; then
            git add daily/
          fi

          # RSS 文件存在时一并提交
          if [ -f "rss.xml" ]; then
            git add rss.xml
          else
            echo "rss.xml 不存在，本次不提交 rss.xml"
          fi

          # 没有文件变化时，不提交，也不发送企业微信
          if git diff --staged --quiet; then
            echo "没有检测到文件变化，无需提交。"

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            echo "commit_url=" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          TODAY_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)

          git commit -m "docs: 自动生成 AI 日报 ${TODAY_DATE}"
          git push

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_url=${COMMIT_URL}" >> "$GITHUB_OUTPUT"

          echo "日报提交成功：${COMMIT_SHA}"

      # 仅在日报发生变化并成功推送后，发送企业微信群机器人消息
      - name: Send daily report to WeCom
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          # 必填：在 GitHub Actions Secrets 中配置
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}

          # 选填：在 GitHub Actions Variables 中配置日报网站地址
          # 例如：https://your-domain.com/
          # 未配置时，自动使用本次 GitHub Commit 地址
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}

          COMMIT_URL: ${{ steps.commit.outputs.commit_url }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "${WECOM_WEBHOOK_URL:-}" ]; then
            echo "::error::未配置 GitHub Actions Secret：WECOM_WEBHOOK_URL"
            exit 1
          fi

          TODAY_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)

          # 优先使用日报网站地址；没有配置时，使用 GitHub Commit 地址
          if [ -n "${REPORT_BASE_URL:-}" ]; then
            REPORT_URL="${REPORT_BASE_URL}"
          else
            REPORT_URL="${COMMIT_URL}"
          fi

          # 截取短 Commit SHA
          SHORT_SHA="${COMMIT_SHA:0:7}"

          MARKDOWN_CONTENT=$(cat <<EOF
          ## AI 资讯日报｜${TODAY_DATE}

          今日 AI 资讯日报已自动生成并发布。

          > 内容包括 AI 行业动态、热门开源项目、前沿论文及相关资讯。

          [点击查看完整日报](${REPORT_URL})

          提交版本：\`${SHORT_SHA}\`
          EOF
          )

          # 使用 jq 生成 JSON，避免换行、双引号等字符破坏请求格式
          PAYLOAD=$(jq -n \
            --arg content "$MARKDOWN_CONTENT" \
            '{
              msgtype: "markdown",
              markdown: {
                content: $content
              }
            }')

          echo "正在发送企业微信消息……"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WECOM_WEBHOOK_URL")

          echo "企业微信返回：${RESPONSE}"

          # 企业微信即使业务失败，也可能返回 HTTP 200，因此必须检查 errcode
          if ! ERR_CODE=$(echo "$RESPONSE" | jq -er '.errcode'); then
            echo "::error::企业微信返回内容不是有效的 JSON，或缺少 errcode"
            exit 1
          fi

          if [ "$ERR_CODE" != "0" ]; then
            ERR_MSG=$(echo "$RESPONSE" | jq -r '.errmsg // "未知错误"')
            echo "::error::企业微信消息发送失败，errcode=${ERR_CODE}，errmsg=${ERR_MSG}"
            exit 1
          fi

          echo "企业微信消息发送成功。"
