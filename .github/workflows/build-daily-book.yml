name: Send Today's AI Daily to WeCom

on:
  schedule:
    # 北京时间 08:10-18:10 每小时检查一次；当天日报一旦成功发送，后续检查自动跳过
    - cron: '10 8-18 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

concurrency:
  group: send-hex2077-daily
  cancel-in-progress: false

jobs:
  send-today-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve today's report
        id: report
        shell: bash
        run: |
          set -euo pipefail

          TODAY_DATE=$(TZ="Asia/Shanghai" date +%Y-%m-%d)
          YEAR_MONTH=$(TZ="Asia/Shanghai" date +%Y-%m)
          DATE_SLASH_FULL=$(TZ="Asia/Shanghai" date +%Y/%m/%d)
          DATE_SLASH_SHORT=$(TZ="Asia/Shanghai" date +%-Y/%-m/%-d)
          REPORT_URL="https://hex2077.dev/docs/${YEAR_MONTH}/${TODAY_DATE}/"
          STATE_FILE=".github/state/last_sent_daily.txt"

          echo "北京时间日期：${TODAY_DATE}"
          echo "检查当天日报：${REPORT_URL}"

          LAST_SENT=""
          if [ -f "$STATE_FILE" ]; then
            LAST_SENT=$(tr -d '\r\n ' < "$STATE_FILE")
          fi

          # 定时任务中，同一天成功发送过后不再重复发送；手动触发仍允许再次测试。
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$LAST_SENT" = "$TODAY_DATE" ]; then
            echo "${TODAY_DATE} 日报今天已经发送过，跳过本次检查。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "date=${TODAY_DATE}" >> "$GITHUB_OUTPUT"
            echo "url=${REPORT_URL}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --output /tmp/today-report.html \
            --write-out '%{http_code}' \
            --connect-timeout 15 \
            --max-time 60 \
            -A "Mozilla/5.0 GitHub-Actions-AI-Daily-Bot" \
            "$REPORT_URL" || true)

          PAGE_TITLE=$(grep -oiE '<title[^>]*>[^<]*</title>' /tmp/today-report.html 2>/dev/null \
            | head -n 1 \
            | sed -E 's/<[^>]+>//g' || true)

          echo "HTTP 状态：${HTTP_CODE}"
          echo "页面标题：${PAGE_TITLE:-未读取到}"

          IS_NOT_FOUND=false
          if printf '%s' "$PAGE_TITLE" | grep -Eiq '(^|[^0-9])404([^0-9]|$)|not found|page not found|页面不存在|找不到页面'; then
            IS_NOT_FOUND=true
          fi

          HAS_REPORT_MARKER=false
          if grep -Fq "$REPORT_URL" /tmp/today-report.html 2>/dev/null \
            || grep -Fq "$TODAY_DATE" /tmp/today-report.html 2>/dev/null \
            || grep -Fq "$DATE_SLASH_FULL" /tmp/today-report.html 2>/dev/null \
            || grep -Fq "$DATE_SLASH_SHORT" /tmp/today-report.html 2>/dev/null; then
            HAS_REPORT_MARKER=true
          fi

          # 页面为 200、不是明确的 404 页面，且正文/元数据中能识别到当天 URL 或当天日期，即判定为已发布。
          if [ "$HTTP_CODE" = "200" ] && [ "$IS_NOT_FOUND" = "false" ] && [ "$HAS_REPORT_MARKER" = "true" ]; then
            echo "检测到当天日报：${TODAY_DATE}"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "当天日报尚未确认发布，本次不发送企业微信。"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

          echo "already_sent=false" >> "$GITHUB_OUTPUT"
          echo "date=${TODAY_DATE}" >> "$GITHUB_OUTPUT"
          echo "url=${REPORT_URL}" >> "$GITHUB_OUTPUT"

      - name: Send today's report to WeCom
        id: wecom
        if: steps.report.outputs.available == 'true'
        shell: bash
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL_RISK_TEST }}
          REPORT_DATE: ${{ steps.report.outputs.date }}
          REPORT_URL: ${{ steps.report.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "${WECOM_WEBHOOK_URL:-}" ]; then
            echo "::error::未配置 GitHub Actions Secret：WECOM_WEBHOOK_URL_RISK_TEST"
            exit 1
          fi

          MARKDOWN_CONTENT=$(cat <<EOF
          ## AI 资讯日报｜${REPORT_DATE}

          hex2077.dev 今日 AI 资讯日报已发布。

          [点击查看今日日报](${REPORT_URL})
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg content "$MARKDOWN_CONTENT" \
            '{msgtype:"markdown",markdown:{content:$content}}')

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WECOM_WEBHOOK_URL")

          echo "企业微信返回：${RESPONSE}"

          ERR_CODE=$(echo "$RESPONSE" | jq -r '.errcode // empty')
          ERR_MSG=$(echo "$RESPONSE" | jq -r '.errmsg // "未知错误"')

          if [ "$ERR_CODE" != "0" ]; then
            echo "::error::企业微信发送失败，errcode=${ERR_CODE:-missing}，errmsg=${ERR_MSG}"
            exit 1
          fi

          echo "企业微信消息发送成功：${REPORT_DATE}"

      - name: Mark today's report as sent
        if: steps.report.outputs.available == 'true' && steps.wecom.conclusion == 'success' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail

          TODAY_DATE="${{ steps.report.outputs.date }}"
          STATE_FILE=".github/state/last_sent_daily.txt"

          mkdir -p "$(dirname "$STATE_FILE")"
          printf '%s\n' "$TODAY_DATE" > "$STATE_FILE"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "$STATE_FILE"

          if git diff --staged --quiet; then
            echo "发送状态无需更新。"
            exit 0
          fi

          git commit -m "chore: mark AI daily sent ${TODAY_DATE}"
          git push origin HEAD:main
          echo "已记录 ${TODAY_DATE} 日报发送状态。"
